name: CI Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-build:
    name: Lint & Build Standalone Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax Lint
        run: make lint

      - name: Build Dist Bundle
        run: make build

      - name: Verify Bundle Integrity
        run: |
          test -x dist/tmux-session-dock
          test -x dist/tmux-sidebar-tmux-adapter

      - name: Verify committed dist matches the build
        run: |
          git diff --exit-code -- dist/ || {
            echo "::error::dist/ is stale - run 'make build' and commit the result"
            exit 1
          }

  test-suite:
    name: Tests (${{ matrix.os }})
    needs: lint-and-build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]   # tmux 3.2a / tmux 3.4 as packaged
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux bc xclip build-essential

      - name: Show tmux version
        run: tmux -V

      - name: Build Dist Bundle
        run: make build

      - name: Test list hygiene
        run: make test-health

      - name: Run CI test list
        env:
          TEST_LOG_DIR: ${{ runner.temp }}/test-logs
        run: make test

      - name: Collect failure artifacts
        if: failure()
        run: |
          set -x
          out="${{ runner.temp }}/failure-artifacts"
          mkdir -p "$out"
          # tests keep their run dir on failure (failure_artifacts/, trace, debug logs)
          for d in /tmp/dotfiles-* /tmp/test-*; do
            [ -d "$d" ] && cp -r "$d" "$out/" 2>/dev/null || true
          done
          [ -f /tmp/tmux-session-launcher-trace.log ] && cp /tmp/tmux-session-launcher-trace.log "$out/" || true
          tmux -V > "$out/tmux-version.txt" 2>&1 || true
          { nproc; locale; echo "TERM=$TERM"; echo "SHELL=$SHELL"; stty -a </dev/tty 2>&1 || echo "no /dev/tty"; } > "$out/runner-env.txt" 2>&1 || true
          du -sh "$out"

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-artifacts-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/test-logs
            ${{ runner.temp }}/failure-artifacts
          retention-days: 7
          if-no-files-found: warn
