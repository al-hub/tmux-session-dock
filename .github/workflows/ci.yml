name: CI Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-build:
    name: Lint & Build Standalone Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax Lint
        run: make lint

      - name: Build Dist Bundle
        run: make build

      - name: Verify Bundle Integrity
        run: |
          test -x dist/tmux-session-dock
          test -x dist/tmux-sidebar-tmux-adapter

  test-suite:
    name: Tests (${{ matrix.os }})
    needs: lint-and-build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]   # tmux 3.2a / tmux 3.4 as packaged
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux bc xclip build-essential

      - name: Show tmux version
        run: tmux -V

      - name: Build Dist Bundle
        run: make build

      - name: Test list hygiene
        run: make test-health

      - name: Run CI test list
        run: make test
