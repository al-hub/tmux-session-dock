name: Release Standalone Bundle

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Dist Bundle
        run: make build

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/tmux-session-dock
            dist/tmux-sidebar-tmux-adapter
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
