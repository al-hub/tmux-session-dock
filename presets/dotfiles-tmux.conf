# ==============================================================================
# dotfiles-tmux.conf - Full Developer Ergonomics Preset for tmux
# Batteries-included configuration provided by tmux-session-dock
# ==============================================================================

# 1. Ergonomic Prefix (Ctrl + a)
# ------------------------------------------------------------------------------
set-option -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix

# 2. Window / Pane Indexing & Lifecycle
# ------------------------------------------------------------------------------
set-option -g base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
bind-key c new-window -c "#{pane_current_path}"

# 3. Dynamic Realtime Pane Border (Active Abbreviated Path & Command)
# ------------------------------------------------------------------------------
set-option -g pane-border-status top
set-option -g pane-border-format "#{?pane_active,#[fg=colour255]#[bold] #P: #[fg=colour39]#{pane_current_command}#[default] #[fg=colour245]in #[fg=colour75]#[bold]#{s|^$HOME|~|:pane_current_path} #[default],#[fg=colour242] #P: #{pane_current_command} in #{s|^$HOME|~|:pane_current_path} #[default]}"
set-option -g pane-border-style "fg=colour238"
set-option -g pane-active-border-style "fg=colour39"

# 4. Instant Alt+Arrow Navigation (0ms Native C-Engine Direct Routing)
# ------------------------------------------------------------------------------
bind-key -n 'M-Left'  select-pane -L
bind-key -n 'M-Right' select-pane -R
bind-key -n 'M-Up'    select-pane -U
bind-key -n 'M-Down'  select-pane -D

# 4b. Window Tabs (Tab / Shift+Tab after the prefix)
# ------------------------------------------------------------------------------
bind-key -N "➡️ Next window" Tab next-window
bind-key -N "⬅️ Previous window" BTab previous-window

# 5. Mouse Support & High-Fidelity Scrolling
# ------------------------------------------------------------------------------
set-option -g mouse on
set-option -g history-limit 50000

# 6. Modern Terminal Capabilities & 24-bit TrueColor
# ------------------------------------------------------------------------------
set-option -s default-terminal "tmux-256color"
set-option -as terminal-overrides ",xterm-256color:Tc,tmux-256color:Tc,alacritty:Tc,kitty:Tc,xterm*:Tc,rxvt-unicode*:Tc"

# 7. Focus Events & Low-Latency Keystrokes
# ------------------------------------------------------------------------------
set-option -s escape-time 10
set-option -g focus-events on
