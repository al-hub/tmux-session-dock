# CVD-Safe theme (Color Vision Deficiency / Okabe-Ito Palette)
# Scientific Basis: All accents come from the Okabe & Ito (2008) Color Universal Design palette, which stays distinguishable under protanopia, deuteranopia and tritanopia (Wong, Nat Methods 8:441, 2011). State changes (prefix, zoom) are signalled by a LUMINANCE swap (orange #E69F00 L=0.43 vs blue #0072B2 L=0.16), never by a red/green hue swap. Neutral grey backgrounds keep hue judgement out of the picture.
# Measured (WCAG 2.x): status fg/bg 6.14:1 (AA) | C-a badge 9.32:1 | window-current 9.10:1 | active path label 15.58:1 | inactive path label 4.83:1 | active border 3.33:1. Backgrounds HSL S=0.00 (pure neutral).
set -g status-style bg='#2b2b2b',fg='#56b4e9'
set -g status-left '#[bg=#e69f00]#[fg=#000000]#{?client_prefix,#[bg=#0072b2]#[fg=#ffffff],}C-a'
set -ga status-left '#[bg=#2b2b2b]#[fg=#f0e442]#{?window_zoomed_flag,#[bg=#f0e442]#[fg=#000000],} z '
set -g window-status-current-style fg='#000000',bg='#56b4e9'
set -g window-style bg='#1e1e1e'
set -g window-active-style bg='#181818'
set -g pane-border-style fg='#3a3a3a',bg='#1e1e1e'
set -g pane-active-border-style fg='#6b6b6b',bg='#181818'
set -g status-right ""
set -g pane-border-format "#{?pane_active,#[fg=#f0f0f0]#[bold]#{pane_current_path}#[default],#[fg=#8a8a8a]#{pane_current_path}#[default]}"
