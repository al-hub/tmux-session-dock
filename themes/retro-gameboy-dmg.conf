# Retro Game Boy DMG-01 (4-Shade Olive LCD, Positive Polarity)
# Basis: the original 1989 DMG-01 reflective STN LCD renders exactly four shades: #0f380f #306230 #8bac0f #9bbc0f. Dark-on-light olive, so it does not overlap retro-crt-phosphor (bright green on black).
set -g status-style bg='#0f380f',fg='#9bbc0f'
set -g status-left '#[bg=#8bac0f]#[fg=#0f380f]#{?client_prefix,#[bg=#9bbc0f]#[fg=#0f380f],}C-a'
set -ga status-left '#[bg=#0f380f]#[fg=#9bbc0f]#{?window_zoomed_flag,#[bg=#9bbc0f]#[fg=#0f380f],} z '
set -g window-status-current-style fg='#0f380f',bg='#9bbc0f'
set -g window-style fg='#0f380f',bg='#8bac0f'
set -g window-active-style fg='#0f380f',bg='#9bbc0f'
set -g pane-border-style fg='#306230',bg='#8bac0f'
set -g pane-active-border-style fg='#0f380f',bg='#9bbc0f'
set -g status-right ""
set -g pane-border-format "#{?pane_active,#[fg=#0f380f]#[bold]#{pane_current_path}#[default],#[fg=#306230]#{pane_current_path}#[default]}"
