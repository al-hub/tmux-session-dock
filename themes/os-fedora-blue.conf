# Fedora Blue Theme (Fedora Project Brand Blues)
# Basis: Fedora brand primary "Fedora Blue" #3c6eb4 with the dark logo blue #294172 (2021 logo refresh) on a near-black neutral ground.
set -g status-style bg='#294172',fg='#dfe9f7'
set -g status-left '#[bg=#3c6eb4]#[fg=#ffffff]#{?client_prefix,#[bg=#ffffff]#[fg=#294172],}C-a'
set -ga status-left '#[bg=#294172]#[fg=#8fb3e6]#{?window_zoomed_flag,#[bg=#8fb3e6]#[fg=#294172],} z '
set -g window-status-current-style fg='#ffffff',bg='#3c6eb4'
set -g window-style bg='#141a24'
set -g window-active-style bg='#0e121a'
set -g pane-border-style fg='#294172',bg='#141a24'
set -g pane-active-border-style fg='#3c6eb4',bg='#0e121a'
set -g status-right ""
set -g pane-border-format "#{?pane_active,#[fg=#dfe9f7]#[bold]#{pane_current_path}#[default],#[fg=#5b7bb0]#{pane_current_path}#[default]}"
