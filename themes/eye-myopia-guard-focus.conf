# Myopia-Guard Focus theme (Active/Inactive Contrast & Deep Negative Polarity)
# Same long-wavelength palette as eye-myopia-guard; active pane goes near-black (#050203) to maximise negative-polarity contrast, active border takes the red accent.
set -g status-style bg='#1a0d0d',fg='#e8a090'
set -g status-left '#[bg=#e0674a]#[fg=#0b0708]#{?client_prefix,#[bg=#f5e6e0],}C-a'
set -ga status-left '#[bg=#1a0d0d]#[fg=#e0674a]#{?window_zoomed_flag,#[bg=#e0674a]#[fg=#0b0708],} z '
set -g window-status-current-style fg='#0b0708',bg='#e8a090'
set -g window-style bg='#160e0f'
set -g window-active-style bg='#050203'
set -g pane-border-style fg='#241515',bg='#160e0f'
set -g pane-active-border-style fg='#e0674a',bg='#050203'
set -g status-right ""
set -g pane-border-format "#{?pane_active,#[fg=#f5e6e0]#[bold]#{pane_current_path}#[default],#[fg=#7a3d33]#{pane_current_path}#[default]}"
