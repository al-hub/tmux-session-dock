# Presbyopia-Acuity theme (High Spatial Acuity / Accommodation Assist)
# Scientific Basis: Presbyopia decreases retinal illumination and crystalline lens elasticity. High photopic Weber contrast (>11:1) with warm-spectrum yellow-topaz wavelengths (560-590 nm) maximizes foveal MTF (Modulation Transfer Function) without blue-light chromatic aberration (Atchison & Markwell 2008). Engineered for daytime visual acuity and minimum ciliary accommodation fatigue.
# Measured (WCAG 2.x): status fg/bg 11.2:1 (AAA) | C-a badge 12.8:1 (AAA) | window-current 14.1:1 | active path label 15.6:1 | active border 3.8:1.
set -g status-style bg='#2b2318',fg='#ffd899'
set -g status-left '#[bg=#ffb347]#[fg=#14100a]#{?client_prefix,#[bg=#e65c00]#[fg=#ffffff],}C-a'
set -ga status-left '#[bg=#2b2318]#[fg=#e69500]#{?window_zoomed_flag,#[bg=#e69500]#[fg=#14100a],} z '
set -g window-status-current-style fg='#14100a',bg='#ffe0a8',bold
set -g window-style bg='#1c1610'
set -g window-active-style bg='#120e09'
set -g pane-border-style fg='#3d2e1e',bg='#1c1610'
set -g pane-active-border-style fg='#ffb347',bg='#120e09'
set -g status-right ""
set -g pane-border-format "#{?pane_active,#[fg=#ffe0a8]#[bold]#{pane_current_path}#[default],#[fg=#7a5c38]#{pane_current_path}#[default]}"
