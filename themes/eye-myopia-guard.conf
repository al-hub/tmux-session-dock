# Myopia-Guard theme (Negative Polarity / Long-Wavelength Accents)
# Scientific Basis: Aleman, Wang & Schaeffel, Sci Rep 8:10840 (2018): 1 h of reading light text on a dark background THICKENED the choroid (~+10 um) while dark-on-light thinned it (~-16 um); choroidal thinning is the established short-term signature of myopia progression. Accents sit in the long-wavelength red band used by repeated low-level red-light (RLRL, 650 nm) myopia-control RCTs (Jiang et al., Ophthalmology 129:509, 2022). Honest limit: a screen theme is NOT RLRL therapy (1600 lx, 3 min x2/day) - this palette only keeps the polarity and spectral direction the evidence favours. Distinct from disp-oled-pureblack (neutral white/black) and retro-crt-amber (#ffb000 amber).
# Measured (WCAG 2.x): status fg/bg 8.91:1 (AAA) | C-a badge 5.92:1 | window-current 9.41:1 | active path label 16.48:1 | active border 2.43:1. Active pane HSL L=0.04.
set -g status-style bg='#1a0d0d',fg='#e8a090'
set -g status-left '#[bg=#e0674a]#[fg=#0b0708]#{?client_prefix,#[bg=#f5e6e0],}C-a'
set -ga status-left '#[bg=#1a0d0d]#[fg=#e0674a]#{?window_zoomed_flag,#[bg=#e0674a]#[fg=#0b0708],} z '
set -g window-status-current-style fg='#0b0708',bg='#e8a090'
set -g window-style bg='#120b0c'
set -g window-active-style bg='#0b0708'
set -g pane-border-style fg='#2e1a1a',bg='#120b0c'
set -g pane-active-border-style fg='#7a3d33',bg='#0b0708'
set -g status-right ""
set -g pane-border-format "#{?pane_active,#[fg=#f5e6e0]#[bold]#{pane_current_path}#[default],#[fg=#7a3d33]#{pane_current_path}#[default]}"
