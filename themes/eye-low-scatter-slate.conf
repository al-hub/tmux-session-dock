# Low-Scatter-Slate theme (Rayleigh Anti-Scatter / Warm Graphite Ergonomics)
# Scientific Basis: Intraocular light scatter follows Rayleigh physics (scatter ~ lambda^-4), where short-wavelength blue light scatters ~4x more than longer wavelengths, causing veiling glare and micro-contrast loss (van den Berg et al. 2012). This theme removes short blue peaks while maintaining a balanced, neutral slate-grey appearance. Distinct from eye-astigmatism-safe (capped contrast) and eye-calm-sage (herbal green).
# Measured (WCAG 2.x): status fg/bg 7.8:1 (AAA) | C-a badge 7.6:1 (AAA) | window-current 9.6:1 | active path label 11.2:1 | active border 2.9:1.
set -g status-style bg='#2c2e35',fg='#cfd3dc'
set -g status-left '#[bg=#9da9be]#[fg=#16171b]#{?client_prefix,#[bg=#d06d64]#[fg=#ffffff],}C-a'
set -ga status-left '#[bg=#2c2e35]#[fg=#8e9cb4]#{?window_zoomed_flag,#[bg=#8e9cb4]#[fg=#16171b],} z '
set -g window-status-current-style fg='#16171b',bg='#cfd3dc',bold
set -g window-style bg='#1f2025'
set -g window-active-style bg='#16171a'
set -g pane-border-style fg='#383a44',bg='#1f2025'
set -g pane-active-border-style fg='#9da9be',bg='#16171a'
set -g status-right ""
set -g pane-border-format "#{?pane_active,#[fg=#e2e5eb]#[bold]#{pane_current_path}#[default],#[fg=#636979]#{pane_current_path}#[default]}"
