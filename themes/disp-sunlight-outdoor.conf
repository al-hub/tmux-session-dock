# Sunlight Outdoor Theme (High Ambient Light / Glare, Maximum Contrast)
# Basis: Direct sunlight washes reflected screen contrast down by an order of magnitude; the only defence is maximum luminance contrast (black on white, 21:1) and fully saturated primaries for state cues. Opposite of disp-paper-sepia's deliberately low-contrast cream.
set -g status-style bg='#000000',fg='#ffffff'
set -g status-left '#[bg=#ffd500]#[fg=#000000]#{?client_prefix,#[bg=#d40000]#[fg=#ffffff],}C-a'
set -ga status-left '#[bg=#000000]#[fg=#ffd500]#{?window_zoomed_flag,#[bg=#ffd500]#[fg=#000000],} z '
set -g window-status-current-style fg='#ffffff',bg='#0057d9'
set -g window-style fg='#000000',bg='#f2f2f2'
set -g window-active-style fg='#000000',bg='#ffffff'
set -g pane-border-style fg='#7a7a7a',bg='#f2f2f2'
set -g pane-active-border-style fg='#0057d9',bg='#ffffff'
set -g status-right ""
set -g pane-border-format "#{?pane_active,#[fg=#000000]#[bold]#{pane_current_path}#[default],#[fg=#4d4d4d]#{pane_current_path}#[default]}"
