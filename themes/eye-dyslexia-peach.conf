# Dyslexia-Peach theme (Positive Polarity / Warm Reading Background)
# Scientific Basis: Rello & Bigham, ASSETS 2017 (n=341, 89 with dyslexia): black text on warm backgrounds (Peach #EDD1B0, Orange, Yellow) read significantly faster than on cool ones (Blue, Blue-Grey, Green), with larger gains for dyslexic readers. Active pane uses the tested Peach #EDD1B0 verbatim; default text is set to near-black #1a1a1a. Distinct from disp-paper-sepia (Kindle cream aesthetic): this is the study colour, not a paper simulation.
# Measured (WCAG 2.x): default text #1a1a1a on active pane #EDD1B0 11.89:1 (AAA), on inactive pane 10.50:1 | status fg/bg 7.07:1 | C-a badge 7.28:1 | window-current 7.28:1 | active path label 6.04:1.
set -g status-style bg='#c9a47c',fg='#2b1d0e'
set -g status-left '#[bg=#5b4636]#[fg=#f6e7d3]#{?client_prefix,#[bg=#a4472f],}C-a'
set -ga status-left '#[bg=#c9a47c]#[fg=#7a2f1c]#{?window_zoomed_flag,#[bg=#a4472f]#[fg=#f6e7d3],} z '
set -g window-status-current-style fg='#f6e7d3',bg='#5b4636'
set -g window-style fg='#1a1a1a',bg='#e3c4a0'
set -g window-active-style fg='#1a1a1a',bg='#edd1b0'
set -g pane-border-style fg='#c9a47c',bg='#e3c4a0'
set -g pane-active-border-style fg='#8a6a4a',bg='#edd1b0'
set -g status-right ""
set -g pane-border-format "#{?pane_active,#[fg=#5b4636]#[bold]#{pane_current_path}#[default],#[fg=#8a6a4a]#{pane_current_path}#[default]}"
