# Retro DOS CGA Blue (IBM 5153 16-Colour Palette, Turbo Pascal / Norton Commander)
# Basis: IBM CGA RGBI palette: blue #0000aa, light grey #aaaaaa, cyan #00aaaa, yellow #ffff55, white #ffffff, light red #ff5555. The classic text-mode IDE look: light-grey/white text on blue with a cyan menu bar.
set -g status-style bg='#00aaaa',fg='#000000'
set -g status-left '#[bg=#ffff55]#[fg=#000000]#{?client_prefix,#[bg=#ff5555]#[fg=#ffffff],}C-a'
set -ga status-left '#[bg=#00aaaa]#[fg=#000000]#{?window_zoomed_flag,#[bg=#000000]#[fg=#ffff55],} z '
set -g window-status-current-style fg='#000000',bg='#ffff55'
set -g window-style fg='#aaaaaa',bg='#000080'
set -g window-active-style fg='#ffffff',bg='#0000aa'
set -g pane-border-style fg='#5555ff',bg='#000080'
set -g pane-active-border-style fg='#ffffff',bg='#0000aa'
set -g status-right ""
set -g pane-border-format "#{?pane_active,#[fg=#ffff55]#[bold]#{pane_current_path}#[default],#[fg=#aaaaaa]#{pane_current_path}#[default]}"
