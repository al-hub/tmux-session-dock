# CVD-Safe Focus theme (Active/Inactive Contrast & Okabe-Ito Accents)
# Same Okabe-Ito accent set as eye-cvd-safe; active pane drops darker and the active border takes the orange #E69F00 accent so focus is readable by luminance alone.
set -g status-style bg='#2b2b2b',fg='#56b4e9'
set -g status-left '#[bg=#e69f00]#[fg=#000000]#{?client_prefix,#[bg=#0072b2]#[fg=#ffffff],}C-a'
set -ga status-left '#[bg=#2b2b2b]#[fg=#f0e442]#{?window_zoomed_flag,#[bg=#f0e442]#[fg=#000000],} z '
set -g window-status-current-style fg='#000000',bg='#56b4e9'
set -g window-style bg='#242424'
set -g window-active-style bg='#121212'
set -g pane-border-style fg='#2e2e2e',bg='#242424'
set -g pane-active-border-style fg='#e69f00',bg='#121212'
set -g status-right ""
set -g pane-border-format "#{?pane_active,#[fg=#ffffff]#[bold]#{pane_current_path}#[default],#[fg=#8a8a8a]#{pane_current_path}#[default]}"
