# E-Ink Mono Theme (Dasung / Boox Grayscale Monitors, 4-Level Grey)
# Basis: E-ink panels show 16 grey levels, no colour, and ghost on mid-tones. Palette is strictly achromatic and uses only four levels (#000000, #555555, #aaaaaa, #ffffff) so every element lands on a stable grey step. Distinct from disp-paper-sepia (warm cream plus colour accents).
set -g status-style bg='#aaaaaa',fg='#000000'
set -g status-left '#[bg=#000000]#[fg=#ffffff]#{?client_prefix,#[bg=#555555],}C-a'
set -ga status-left '#[bg=#aaaaaa]#[fg=#000000]#{?window_zoomed_flag,#[bg=#000000]#[fg=#ffffff],} z '
set -g window-status-current-style fg='#ffffff',bg='#000000'
set -g window-style fg='#000000',bg='#ffffff'
set -g window-active-style fg='#000000',bg='#ffffff'
set -g pane-border-style fg='#aaaaaa',bg='#ffffff'
set -g pane-active-border-style fg='#000000',bg='#ffffff'
set -g status-right ""
set -g pane-border-format "#{?pane_active,#[fg=#000000]#[bold]#{pane_current_path}#[default],#[fg=#555555]#{pane_current_path}#[default]}"
