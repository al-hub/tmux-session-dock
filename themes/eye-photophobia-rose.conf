# Photophobia-Rose theme (Migraine / Light Sensitivity, FL-41 Tint Analogue)
# Scientific Basis: FL-41 rose-tinted lenses attenuate ~80% of 480-520 nm blue-green light, the peak sensitivity band of melanopsin ipRGCs that feed photophobia and migraine pain pathways (Katz & Digre, Surv Ophthalmol 2016; FL-41 vs neural photophobia activation, Am J Ophthalmol 2023). Palette removes cyan/green entirely and keeps overall luminance low. Distinct from eye-circadian-warm: that theme is amber (night-time melatonin), this one is rose (daytime pain-pathway attenuation).
# Measured (WCAG 2.x): status fg/bg 7.62:1 (AAA) | C-a badge 6.67:1 | window-current 8.78:1 | active path label 11.81:1 | active border 2.41:1. Backgrounds hue 340-347 (rose), HSL L 0.08-0.14.
set -g status-style bg='#2a1e22',fg='#d9a5b0'
set -g status-left '#[bg=#c98a97]#[fg=#1a1114]#{?client_prefix,#[bg=#8c4a5c]#[fg=#f3dde2],}C-a'
set -ga status-left '#[bg=#2a1e22]#[fg=#b5697d]#{?window_zoomed_flag,#[bg=#b5697d]#[fg=#2a1e22],} z '
set -g window-status-current-style fg='#1a1114',bg='#d9a5b0'
set -g window-style bg='#201719'
set -g window-active-style bg='#1a1114'
set -g pane-border-style fg='#3a2a2f',bg='#201719'
set -g pane-active-border-style fg='#6b4a55',bg='#1a1114'
set -g status-right ""
set -g pane-border-format "#{?pane_active,#[fg=#e8c6cd]#[bold]#{pane_current_path}#[default],#[fg=#6b4a55]#{pane_current_path}#[default]}"
