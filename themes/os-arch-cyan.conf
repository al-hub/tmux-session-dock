# Arch Cyan Theme (Arch Linux Brand #1793d1 on Dark Grey #333333)
# Basis: Arch Linux brand colours are exactly two: cyan-blue #1793d1 and dark grey #333333. Everything else is a shade of those two.
set -g status-style bg='#333333',fg='#5fb3e0'
set -g status-left '#[bg=#1793d1]#[fg=#0d1a24]#{?client_prefix,#[bg=#ffffff]#[fg=#1793d1],}C-a'
set -ga status-left '#[bg=#333333]#[fg=#5fb3e0]#{?window_zoomed_flag,#[bg=#5fb3e0]#[fg=#333333],} z '
set -g window-status-current-style fg='#0d1a24',bg='#1793d1'
set -g window-style bg='#262626'
set -g window-active-style bg='#1a1a1a'
set -g pane-border-style fg='#404040',bg='#262626'
set -g pane-active-border-style fg='#1793d1',bg='#1a1a1a'
set -g status-right ""
set -g pane-border-format "#{?pane_active,#[fg=#e6f2fa]#[bold]#{pane_current_path}#[default],#[fg=#7a7a7a]#{pane_current_path}#[default]}"
