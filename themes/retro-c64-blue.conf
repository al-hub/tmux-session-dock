# Retro Commodore 64 Blue (VIC-II Boot Screen, Pepto Palette)
# Basis: VIC-II colours as measured by Philip 'Pepto' Timmermann (pepto.de/projects/colorvic): blue #352879 (screen), light blue #6c5eb5 (border & text), light grey #959595, white #ffffff. The 1982 boot screen: light-blue text on blue inside a light-blue border. Default text is the authentic light-blue-on-blue at 2.26:1 - swap window-style fg to #959595 (light grey) if you want AA legibility over authenticity.
set -g status-style bg='#6c5eb5',fg='#ffffff'
set -g status-left '#[bg=#ffffff]#[fg=#352879]#{?client_prefix,#[bg=#b8c76f]#[fg=#352879],}C-a'
set -ga status-left '#[bg=#6c5eb5]#[fg=#352879]#{?window_zoomed_flag,#[bg=#352879]#[fg=#6c5eb5],} z '
set -g window-status-current-style fg='#352879',bg='#ffffff'
set -g window-style fg='#6c5eb5',bg='#2e2266'
set -g window-active-style fg='#6c5eb5',bg='#352879'
set -g pane-border-style fg='#4b3f9a',bg='#2e2266'
set -g pane-active-border-style fg='#6c5eb5',bg='#352879'
set -g status-right ""
set -g pane-border-format "#{?pane_active,#[fg=#ffffff]#[bold]#{pane_current_path}#[default],#[fg=#959595]#{pane_current_path}#[default]}"
