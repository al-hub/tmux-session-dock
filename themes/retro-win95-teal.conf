# Retro Windows 95 Teal (Desktop #008080, Silver Chrome, Navy Title Bar)
# Basis: Windows 95 default scheme: desktop teal #008080, 3D-object silver #c0c0c0, active title bar navy #000080, shadow #808080, highlight #ffffff. Console text-mode look kept for the panes.
set -g status-style bg='#c0c0c0',fg='#000000'
set -g status-left '#[bg=#000080]#[fg=#ffffff]#{?client_prefix,#[bg=#008080]#[fg=#ffffff],}C-a'
set -ga status-left '#[bg=#c0c0c0]#[fg=#000080]#{?window_zoomed_flag,#[bg=#000080]#[fg=#ffffff],} z '
set -g window-status-current-style fg='#ffffff',bg='#000080'
set -g window-style fg='#ffffff',bg='#006666'
set -g window-active-style fg='#ffffff',bg='#008080'
set -g pane-border-style fg='#808080',bg='#006666'
set -g pane-active-border-style fg='#ffffff',bg='#008080'
set -g status-right ""
set -g pane-border-format "#{?pane_active,#[fg=#ffffff]#[bold]#{pane_current_path}#[default],#[fg=#c0c0c0]#{pane_current_path}#[default]}"
