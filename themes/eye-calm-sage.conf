# Calm-Sage theme (Low-Arousal / Stress Reduction, Desaturated Blue-Green)
# Scientific Basis: Wilms & Oberfeld, Psychol Res 82:896 (2018, n=62, factorial hue x saturation x brightness): arousal, heart rate and skin conductance rise with SATURATION and BRIGHTNESS more than with hue, and hue arousal increases blue < green < red. So this palette is low-saturation (all backgrounds HSL S = 0.09), mid-dark, blue-green, with no red anywhere - even the prefix indicator is a dusty blue. Hue family follows Ulrich (Science 224:420, 1984) / Kaplan ART nature-view stress-recovery findings. Distinct from eye-scotopic-forest (saturated deep green for darkrooms) and open-everforest (saturated accents).
# Measured (WCAG 2.x): status fg/bg 5.53:1 (AA) | C-a badge 5.57:1 | window-current 7.23:1 | active path label 10.51:1 | active border 3.63:1. All backgrounds HSL S=0.09, badge S=0.11; brightest surface L=0.25.
set -g status-style bg='#3a4542',fg='#b8c4bc'
set -g status-left '#[bg=#8fa69a]#[fg=#242b29]#{?client_prefix,#[bg=#6b8a95]#[fg=#1c2220],}C-a'
set -ga status-left '#[bg=#3a4542]#[fg=#9fb3a8]#{?window_zoomed_flag,#[bg=#9fb3a8]#[fg=#3a4542],} z '
set -g window-status-current-style fg='#242b29',bg='#a9bcb0'
set -g window-style bg='#2c3533'
set -g window-active-style bg='#242b29'
set -g pane-border-style fg='#3f4a47',bg='#2c3533'
set -g pane-active-border-style fg='#6f847c',bg='#242b29'
set -g status-right ""
set -g pane-border-format "#{?pane_active,#[fg=#d5ded8]#[bold]#{pane_current_path}#[default],#[fg=#6f847c]#{pane_current_path}#[default]}"
