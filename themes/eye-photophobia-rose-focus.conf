# Photophobia-Rose Focus theme (Active/Inactive Contrast & FL-41 Rose)
# Same rose palette as eye-photophobia-rose; active pane drops darker and the active border takes the dusty-rose accent. No cyan/green anywhere.
set -g status-style bg='#2a1e22',fg='#d9a5b0'
set -g status-left '#[bg=#c98a97]#[fg=#1a1114]#{?client_prefix,#[bg=#8c4a5c]#[fg=#f3dde2],}C-a'
set -ga status-left '#[bg=#2a1e22]#[fg=#b5697d]#{?window_zoomed_flag,#[bg=#b5697d]#[fg=#2a1e22],} z '
set -g window-status-current-style fg='#1a1114',bg='#d9a5b0'
set -g window-style bg='#241a1e'
set -g window-active-style bg='#130c0f'
set -g pane-border-style fg='#2a1e22',bg='#241a1e'
set -g pane-active-border-style fg='#d9a5b0',bg='#130c0f'
set -g status-right ""
set -g pane-border-format "#{?pane_active,#[fg=#f3dde2]#[bold]#{pane_current_path}#[default],#[fg=#6b4a55]#{pane_current_path}#[default]}"
