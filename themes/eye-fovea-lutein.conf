# Fovea-Lutein theme (Macular Carotenoid Analogue / 400-460nm Blue Attenuation)
# Scientific Basis: Macular pigment (lutein + zeaxanthin) acts as an intraocular optical filter peaking at 446 nm (Bone et al. 1992; Stringham & Hammond 2008). Warm xanthophyll ochre (hue 45-48 deg) absorbs short-wavelength HEV while preserving high foveal contrast on neutral basalt ground. Distinct from eye-circadian-warm (night amber) and eye-calm-sage (blue-green).
# Measured (WCAG 2.x): status fg/bg 9.8:1 (AAA) | C-a badge 9.4:1 (AAA) | window-current 11.8:1 | active path label 12.6:1 | active border 3.2:1.
set -g status-style bg='#28251e',fg='#ecd29b'
set -g status-left '#[bg=#e5a93b]#[fg=#181714]#{?client_prefix,#[bg=#c25428]#[fg=#ffffff],}C-a'
set -ga status-left '#[bg=#28251e]#[fg=#d4952c]#{?window_zoomed_flag,#[bg=#d4952c]#[fg=#181714],} z '
set -g window-status-current-style fg='#181714',bg='#ecd29b',bold
set -g window-style bg='#1e1d19'
set -g window-active-style bg='#151412'
set -g pane-border-style fg='#38342b',bg='#1e1d19'
set -g pane-active-border-style fg='#e5a93b',bg='#151412'
set -g status-right ""
set -g pane-border-format "#{?pane_active,#[fg=#ecd29b]#[bold]#{pane_current_path}#[default],#[fg=#6e6249]#{pane_current_path}#[default]}"
