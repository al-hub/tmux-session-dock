# Debian Magenta Theme (Debian Swirl, PANTONE Strong Red C)
# Basis: Debian logo colour is PANTONE Strong Red C, rendered #ce0056 (debian.org/logos); the legacy SVG fill is #a80030 and GIMP conversions give #d70a53. Ubuntu's aubergine sits at hue 320 in violet; this stays at hue 335 magenta-red.
set -g status-style bg='#2b0a18',fg='#f2b8d0'
set -g status-left '#[bg=#ce0056]#[fg=#ffffff]#{?client_prefix,#[bg=#ffffff]#[fg=#a80030],}C-a'
set -ga status-left '#[bg=#2b0a18]#[fg=#ce0056]#{?window_zoomed_flag,#[bg=#ce0056]#[fg=#ffffff],} z '
set -g window-status-current-style fg='#ffffff',bg='#a80030'
set -g window-style bg='#1c0810'
set -g window-active-style bg='#14050b'
set -g pane-border-style fg='#3d1224',bg='#1c0810'
set -g pane-active-border-style fg='#a80030',bg='#14050b'
set -g status-right ""
set -g pane-border-format "#{?pane_active,#[fg=#fbe4ee]#[bold]#{pane_current_path}#[default],#[fg=#8a4a63]#{pane_current_path}#[default]}"
