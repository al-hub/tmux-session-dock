# 256-Color Exact Theme (Lossless on Terminals Without TrueColor)
# Basis: Every value here is an exact member of the xterm-256 6x6x6 cube or 24-step grey ramp (levels 00/5f/87/af/d7/ff; greys 08+0a*n), so tmux's nearest-colour fallback picks the identical index over SSH, in screen, or in any TERM without Tc/RGB. Other themes shift hue when quantised; this one cannot.
set -g status-style bg='#262626',fg='#00afff'
set -g status-left '#[bg=#ffaf00]#[fg=#080808]#{?client_prefix,#[bg=#0087ff],}C-a'
set -ga status-left '#[bg=#262626]#[fg=#ffaf00]#{?window_zoomed_flag,#[bg=#ffaf00]#[fg=#080808],} z '
set -g window-status-current-style fg='#080808',bg='#00d7d7'
set -g window-style bg='#121212'
set -g window-active-style bg='#080808'
set -g pane-border-style fg='#303030',bg='#121212'
set -g pane-active-border-style fg='#808080',bg='#080808'
set -g status-right ""
set -g pane-border-format "#{?pane_active,#[fg=#eeeeee]#[bold]#{pane_current_path}#[default],#[fg=#767676]#{pane_current_path}#[default]}"
