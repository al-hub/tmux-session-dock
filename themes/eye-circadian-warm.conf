# Circadian-Warm theme (Blue-light Filtering / Melatonin Protection)
# Scientific Basis: Melanopsin ipRGCs peak near 480 nm and drive melatonin suppression; long-wavelength amber light near 30 deg hue minimises melanopic irradiance (Brainard et al., J Neurosci 21:6405, 2001; Thapan et al., J Physiol 535:261, 2001). Night-time aim: keep melatonin onset intact. Sister theme eye-photophobia-rose targets the same 480 nm band for daytime migraine relief with a rose instead of amber tint.
# Measured (WCAG 2.x): status fg/bg 8.95:1 (AAA) | C-a badge 9.01:1 | window-current 13.36:1 | active path label 13.36:1 | inactive path label 1.79:1 | active border 1.89:1. All backgrounds hue 30-34 (amber), HSL L 0.07-0.13.
set -g status-style bg='#332211',fg='#ffb86c'
set -g status-left '#[bg=#f8a145]#[fg=#18120a]#{?client_prefix,#[bg=#d86030],}C-a'
set -ga status-left '#[bg=#332211]#[fg=#d86030]#{?window_zoomed_flag,#[bg=#d86030]#[fg=#332211],} z '
set -g window-status-current-style fg='#18120a',bg='#ffd3a3'
set -g window-style bg='#1e1810'
set -g window-active-style bg='#18120a'
set -g pane-border-style fg='#2d2010',bg='#18120a'
set -g pane-active-border-style fg='#5c3d18',bg='#1e1810'
set -g status-right ""
set -g pane-border-format "#{?pane_active,#[fg=#ffd3a3]#[bold]#{pane_current_path}#[default],#[fg=#5c3d18]#{pane_current_path}#[default]}"
