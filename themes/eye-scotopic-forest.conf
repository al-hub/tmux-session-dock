# Scotopic-Forest theme (Rod-adapted Green / Low Luminance)
# Scientific Basis: Rod (scotopic) sensitivity peaks near 507 nm, i.e. the Purkinje shift toward blue-green under low luminance (CIE 1951 scotopic luminosity function V'(lambda)); the photopic peak is 555 nm. A dark green ground plus pale green text stays legible at the lowest monitor brightness, for darkrooms and night shifts. Sister theme eye-calm-sage is the desaturated, mid-luminance stress-reduction variant of the same hue family.
# Measured (WCAG 2.x): status fg/bg 6.54:1 (AA) | C-a badge 8.94:1 | window-current 9.14:1 | active path label 9.14:1 | inactive path label 1.21:1 (deliberately near-invisible) | active border 2.24:1. Backgrounds hue 148-150 (green), HSL L 0.07-0.17.
set -g status-style bg='#22332a',fg='#a3be8c'
set -g status-left '#[bg=#8fbcbb]#[fg=#0e1411]#{?client_prefix,#[bg=#bf616a],}C-a'
set -ga status-left '#[bg='#22332a']#[fg=#bf616a]#{?window_zoomed_flag,#[bg=#bf616a]#[fg=#22332a],} z '
set -g window-status-current-style fg='#0e1411',bg='#a3be8c'
set -g window-style bg='#121815'
set -g window-active-style bg='#0e1411'
set -g pane-border-style fg='#1c2b22',bg='#0e1411'
set -g pane-active-border-style fg='#385444',bg='#121815'
set -g status-right ""
set -g pane-border-format "#{?pane_active,#[fg=#a3be8c]#[bold]#{pane_current_path}#[default],#[fg=#1c2b22]#{pane_current_path}#[default]}"
