# Presbyopia-Acuity Focus theme (High Spatial Acuity / Active-Inactive Split)
set -g status-style bg='#2b2318',fg='#ffd899'
set -g status-left '#[bg=#ffb347]#[fg=#14100a]#{?client_prefix,#[bg=#e65c00]#[fg=#ffffff],}C-a'
set -ga status-left '#[bg=#2b2318]#[fg=#e69500]#{?window_zoomed_flag,#[bg=#e69500]#[fg=#14100a],} z '
set -g window-status-current-style fg='#14100a',bg='#ffe0a8',bold
set -g window-style bg='#241c14'
set -g window-active-style bg='#0d0a06'
set -g pane-border-style fg='#423120',bg='#241c14'
set -g pane-active-border-style fg='#ffb347',bg='#0d0a06'
set -g status-right ""
set -g pane-border-format "#{?pane_active,#[fg=#ffe0a8]#[bold]#{pane_current_path}#[default],#[fg=#8c693f]#{pane_current_path}#[default]}"
