# NixOS Lavender Theme (Nix Snowflake Blues)
# Basis: hex values lifted verbatim from nixos-artwork logo/nix-snowflake-colours.svg: #5277c3 #4a6baf #415e9a (dark lambdas) and #7ebae4 #7eb1dd #699ad7 (light lambdas).
set -g status-style bg='#2a3550',fg='#7ebae4'
set -g status-left '#[bg=#7ebae4]#[fg=#1c2333]#{?client_prefix,#[bg=#5277c3]#[fg=#ffffff],}C-a'
set -ga status-left '#[bg=#2a3550]#[fg=#699ad7]#{?window_zoomed_flag,#[bg=#699ad7]#[fg=#1c2333],} z '
set -g window-status-current-style fg='#ffffff',bg='#4a6baf'
set -g window-style bg='#1c2333'
set -g window-active-style bg='#151a27'
set -g pane-border-style fg='#415e9a',bg='#1c2333'
set -g pane-active-border-style fg='#7ebae4',bg='#151a27'
set -g status-right ""
set -g pane-border-format "#{?pane_active,#[fg=#e3eefa]#[bold]#{pane_current_path}#[default],#[fg=#5277c3]#{pane_current_path}#[default]}"
