# Astigmatism-Safe theme (Low Contrast / Reduced Halation)
# Scientific Basis: Astigmatism scatters bright glyphs on dark ground into halos (halation); the fix is to cap contrast rather than maximise it. Target band WCAG 2.x AA 4.5:1 to ~7:1 on primary text (WCAG 2.1 SC 1.4.3 / 1.4.6; halation and low-vision guidance in WebAIM Contrast & Color). Dark polarity retained because light polarity raises glare for the same population.
# Measured (WCAG 2.x): status fg/bg 6.57:1 (AA) | C-a badge 11.99:1 | window-current 7.80:1 | active path label 12.59:1 | inactive path label 2.62:1 | active border 2.13:1. Note: the two bold labels exceed the 7:1 cap; status text sits inside the AA band as intended.
set -g status-style bg='#282c34',fg='#abb2bf'
set -g status-left '#[bg=#e0e0e0]#[fg=#20222c]#{?client_prefix,#[bg=#e06c75],}C-a'
set -ga status-left '#[bg=#282c34]#[fg=#e06c75]#{?window_zoomed_flag,#[bg=#e06c75]#[fg=#282c34],} z '
set -g window-status-current-style fg='#1c1e26',bg='#abb2bf'
set -g window-style bg='#20222c'
set -g window-active-style bg='#1c1e26'
set -g pane-border-style fg='#2d3139',bg='#1c1e26'
set -g pane-active-border-style fg='#4b5263',bg='#20222c'
set -g status-right ""
set -g pane-border-format "#{?pane_active,#[fg=#e0e0e0]#[bold]#{pane_current_path}#[default],#[fg=#5c6370]#{pane_current_path}#[default]}"
