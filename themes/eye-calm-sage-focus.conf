# Calm-Sage Focus theme (Active/Inactive Contrast & Desaturated Sage)
# Same low-saturation palette as eye-calm-sage; active pane drops darker and the active border takes the sage accent. Still no red anywhere.
set -g status-style bg='#3a4542',fg='#b8c4bc'
set -g status-left '#[bg=#8fa69a]#[fg=#242b29]#{?client_prefix,#[bg=#6b8a95]#[fg=#1c2220],}C-a'
set -ga status-left '#[bg=#3a4542]#[fg=#9fb3a8]#{?window_zoomed_flag,#[bg=#9fb3a8]#[fg=#3a4542],} z '
set -g window-status-current-style fg='#242b29',bg='#a9bcb0'
set -g window-style bg='#313b38'
set -g window-active-style bg='#1c2220'
set -g pane-border-style fg='#3a4542',bg='#313b38'
set -g pane-active-border-style fg='#8fa69a',bg='#1c2220'
set -g status-right ""
set -g pane-border-format "#{?pane_active,#[fg=#e2e9e5]#[bold]#{pane_current_path}#[default],#[fg=#6f847c]#{pane_current_path}#[default]}"
