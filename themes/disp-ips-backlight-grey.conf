# IPS Backlight Grey Theme (Hides IPS Glow, Backlight Bleed & Poor Black Uniformity)
# Basis: IPS/VA LCDs cannot switch pixels off; pure #000000 exposes edge bleed, IPS glow and clouding. Lifting every background to a neutral #1a1a1a-#242424 band (the range used by VS Code Dark+ #1e1e1e and Windows Terminal Campbell #0c0c0c-#1e1e1e) makes non-uniform black levels invisible. Opposite end of the axis from disp-oled-pureblack.
set -g status-style bg='#2a2a2a',fg='#c8c8c8'
set -g status-left '#[bg=#9cdcfe]#[fg=#1a1a1a]#{?client_prefix,#[bg=#ce9178],}C-a'
set -ga status-left '#[bg=#2a2a2a]#[fg=#ce9178]#{?window_zoomed_flag,#[bg=#ce9178]#[fg=#1a1a1a],} z '
set -g window-status-current-style fg='#1a1a1a',bg='#9cdcfe'
set -g window-style bg='#242424'
set -g window-active-style bg='#1a1a1a'
set -g pane-border-style fg='#3c3c3c',bg='#242424'
set -g pane-active-border-style fg='#6e6e6e',bg='#1a1a1a'
set -g status-right ""
set -g pane-border-format "#{?pane_active,#[fg=#e6e6e6]#[bold]#{pane_current_path}#[default],#[fg=#8c8c8c]#{pane_current_path}#[default]}"
